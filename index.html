<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depot Analyst</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Depot Analyst">
<style>
:root{--bg:#0e151c;--panel:#141d26;--ink:#e7edf2;--ink2:#b6c2cd;--muted:#8393a1;--line:#2a3744;--accent:#d9a640;--bad:#ef6a6a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;display:flex;align-items:center;justify-content:center;
 padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.box{width:100%;max-width:380px;display:grid;gap:18px}
.logo{width:64px;height:64px;border-radius:16px}
h1{margin:0;font-size:26px;letter-spacing:.01em}
p{margin:0;color:var(--ink2);font-size:15px;line-height:1.5}
form{display:grid;gap:12px}
label{font-size:13px;color:var(--muted)}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.row input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;font-size:16px;font-weight:600;padding:13px;border-radius:10px;border:0;background:var(--accent);color:#1a1405;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:20px}
.note{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="icon-192.png" alt="">
  <div><h1>Depot Analyst</h1><p>Privates Dashboard. Die Inhalte sind verschlüsselt und werden erst auf deinem Gerät mit dem Passwort entschlüsselt.</p></div>
  <form id="f" autocomplete="on">
    <label for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <label class="row" for="rem"><input id="rem" type="checkbox" checked> Auf diesem Gerät merken</label>
    <button id="go" type="submit">Entsperren</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="note">Ohne richtiges Passwort lässt sich die Seite nicht lesen – auch nicht im Quelltext.</p>
</main>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var b64=function(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
  var tob64=function(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  var err=document.getElementById('err'), go=document.getElementById('go');
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
  if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){err.textContent='Dieser Browser ist zu alt. Bitte aktuelles Safari, Chrome oder Firefox verwenden.';go.disabled=true;return}
  async function deriveKey(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function open(key){
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }
  async function tryStored(){
    var raw=null; try{raw=localStorage.getItem('da-key')}catch(e){}
    if(!raw) return;
    try{var k=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},false,['decrypt']); await open(k)}
    catch(e){try{localStorage.removeItem('da-key')}catch(_){}}
  }
  document.getElementById('f').addEventListener('submit',async function(ev){
    ev.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Entschlüssele …';
    try{
      var key=await deriveKey(document.getElementById('pw').value);
      if(document.getElementById('rem').checked){try{localStorage.setItem('da-key',tob64(await crypto.subtle.exportKey('raw',key)))}catch(e){}}
      await open(key);
    }catch(e){err.textContent='Passwort falsch. Bitte erneut versuchen.'; go.disabled=false; go.textContent='Entsperren'; try{localStorage.removeItem('da-key')}catch(_){}}
  });
  tryStored();
})();
</script>
